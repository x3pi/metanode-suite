[package]
name = "rust-verifier"
version = "0.1.0"
edition = "2021"

[dependencies]
nomt = { git = "https://github.com/thrumdev/nomt.git", features = ["blake3-hasher", "serde"] }
nomt-core = { git = "https://github.com/thrumdev/nomt.git", features = ["std", "blake3-hasher", "serde"] }
tokio = { version = "1.0", features = ["full", "rt-multi-thread"] }
reqwest = { version = "0.11", features = ["json"] }
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
hex = "0.4"
bincode = "1.3"
bitvec = "1.0"
sha3 = "0.12.0"
blake3 = "1.8.5"
